<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Wall</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            overflow-x: hidden;
        }

        /* Grid */
        .grid {
            display: grid;
            gap: 2px;
            min-height: 100vh;
            padding: 2px;
        }

        .grid.compact {
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        }

        .grid.medium {
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
        }

        .grid.large {
            grid-template-columns: repeat(auto-fit, minmax(550px, 1fr));
        }

        @media (max-width: 1400px) {
            .grid.medium {
                grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            }
        }

        @media (max-width: 1000px) {
            .grid.compact {
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            }
            .grid.medium {
                grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            }
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr !important;
            }
        }

        /* Panel */
        .panel {
            position: relative;
            background: #0a0a0a;
            aspect-ratio: 16/9;
            overflow: hidden;
            cursor: grab;
            transition: box-shadow 0.3s ease, transform 0.2s ease;
        }

        .panel.dragging {
            opacity: 0.5;
            cursor: grabbing;
            transform: scale(0.95);
        }

        .panel.drag-over {
            box-shadow: 0 0 0 3px #ffd60a;
        }

        .panel.favorite {
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.3);
        }

        .panel.favorite.active {
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.3), 0 0 0 4px #bf5af2, 0 0 20px rgba(191, 90, 242, 0.4);
        }

        .panel.active {
            box-shadow: 0 0 0 2px #bf5af2, 0 0 20px rgba(191, 90, 242, 0.4);
        }

        .panel iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            pointer-events: none;
        }

        .panel-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
            cursor: grab;
        }

        .panel.active .panel-overlay {
            cursor: pointer;
        }

        .panel.dragging .panel-overlay {
            cursor: grabbing;
        }

        .favorite-star {
            position: absolute;
            top: 0.5rem;
            left: 0.5rem;
            width: 24px;
            height: 24px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.875rem;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
        }

        .panel:hover .favorite-star,
        .panel.favorite .favorite-star {
            opacity: 1;
        }

        .panel.favorite .favorite-star {
            color: #ffd60a;
        }

        .panel-actions {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            display: flex;
            gap: 0.25rem;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .panel:hover .panel-actions {
            opacity: 1;
        }

        .panel-action-btn {
            width: 24px;
            height: 24px;
            background: rgba(0, 0, 0, 0.7);
            border: none;
            border-radius: 50%;
            color: #fff;
            font-size: 0.75rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .panel-action-btn:hover {
            background: rgba(0, 0, 0, 0.9);
            transform: scale(1.1);
        }

        .panel.active iframe {
            pointer-events: auto;
        }

        /* Empty state */
        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            flex-direction: column;
            gap: 2rem;
            padding: 2rem;
            text-align: center;
        }

        .empty-title {
            font-size: 3rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .empty-subtitle {
            font-size: 1rem;
            opacity: 0.6;
        }

        .empty-btn {
            background: #00d9ff;
            color: #000;
            border: none;
            padding: 1rem 2rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .empty-btn:hover {
            background: #00b8e6;
            transform: translateY(-2px);
        }

        /* Footer */
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid #333;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }

        .footer.visible {
            transform: translateY(0);
        }

        .footer-left {
            font-size: 0.875rem;
            opacity: 0.8;
        }

        .footer-right {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .grid-size-controls {
            display: flex;
            gap: 0.25rem;
            border: 1px solid #333;
            border-radius: 4px;
            overflow: hidden;
        }

        .grid-size-btn {
            background: transparent;
            border: none;
            color: #fff;
            padding: 0.5rem 0.75rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s ease;
            opacity: 0.5;
        }

        .grid-size-btn.active {
            background: #bf5af2;
            opacity: 1;
        }

        .grid-size-btn:hover {
            opacity: 1;
        }

        .footer-btn {
            background: transparent;
            border: 1px solid #333;
            color: #fff;
            padding: 0.5rem 1rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .footer-btn:hover {
            border-color: #00d9ff;
            color: #00d9ff;
        }

        .footer-toggle {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #333;
            color: #fff;
            width: 40px;
            height: 40px;
            font-size: 1.25rem;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            transition: all 0.2s ease;
        }

        .footer-toggle:hover {
            background: #00d9ff;
            color: #000;
            border-color: #00d9ff;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 8px;
            max-width: 1000px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 2rem;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #333;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
            padding: 0;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.6;
            transition: opacity 0.2s ease;
        }

        .close-btn:hover {
            opacity: 1;
        }

        .sources-list {
            display: grid;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .source-item {
            background: #111;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .source-info {
            flex: 1;
        }

        .source-name {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .source-meta {
            font-size: 0.75rem;
            opacity: 0.6;
        }

        .source-actions {
            display: flex;
            gap: 0.5rem;
        }

        .fav-btn, .edit-btn, .delete-btn {
            background: transparent;
            border: 1px solid #333;
            color: #fff;
            padding: 0.5rem 1rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .fav-btn:hover {
            border-color: #ffd60a;
            color: #ffd60a;
        }

        .fav-btn.active {
            background: #ffd60a;
            color: #000;
            border-color: #ffd60a;
        }

        .edit-btn:hover {
            border-color: #00d9ff;
            color: #00d9ff;
        }

        .delete-btn:hover {
            border-color: #ff4444;
            color: #ff4444;
        }

        .add-btn {
            background: #00d9ff;
            color: #000;
            border: none;
            padding: 1rem 2rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 4px;
            width: 100%;
            transition: all 0.2s ease;
        }

        .add-btn:hover {
            background: #00b8e6;
        }

        /* Form */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-size: 0.75rem;
            margin-bottom: 0.5rem;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-input {
            width: 100%;
            background: #111;
            border: 1px solid #333;
            color: #fff;
            padding: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            border-radius: 4px;
            transition: border-color 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #00d9ff;
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn-primary {
            background: #00d9ff;
            color: #000;
            border: none;
            padding: 0.75rem 2rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 4px;
            flex: 1;
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            background: #00b8e6;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid #333;
            color: #fff;
            padding: 0.75rem 2rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            cursor: pointer;
            border-radius: 4px;
            flex: 1;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            border-color: #fff;
        }
    </style>
</head>
<body>
    <!-- Grid -->
    <div id="gridContainer"></div>

    <!-- Empty State -->
    <div id="emptyState" class="empty-state">
        <div class="empty-title">NEWS WALL</div>
        <div class="empty-subtitle">Click below to add your first news source</div>
        <button class="empty-btn" onclick="openAddSource()">+ ADD SOURCE</button>
    </div>

    <!-- Footer -->
    <div id="footer" class="footer">
        <div class="footer-left">NEWS WALL</div>
        <div class="footer-right">
            <select id="regionFilter" class="footer-btn" onchange="filterByRegion(this.value)" style="padding: 0.4rem 0.8rem;">
                <option value="all">All Regions</option>
                <option value="us">United States</option>
                <option value="europe">Europe</option>
                <option value="latam">Latin America</option>
                <option value="mena">MENA</option>
                <option value="asia">Asia-Pacific</option>
                <option value="africa">Africa</option>
                <option value="other">Other</option>
            </select>
            <button class="footer-btn" onclick="muteAll()">MUTE ALL</button>
            <div class="grid-size-controls">
                <button class="grid-size-btn" onclick="setGridSize('compact')" title="Compact">◾◾◾</button>
                <button class="grid-size-btn active" onclick="setGridSize('medium')" title="Medium">◾◾</button>
                <button class="grid-size-btn" onclick="setGridSize('large')" title="Large">◾</button>
            </div>
            <button class="footer-btn" onclick="openManageSources()">MANAGE SOURCES</button>
            <button class="footer-btn" onclick="exportSources()">EXPORT</button>
            <button class="footer-btn" onclick="importSources()">IMPORT</button>
        </div>
    </div>

    <!-- Footer Toggle -->
    <button id="footerToggle" class="footer-toggle" onclick="toggleFooter()">⚙</button>

    <!-- Manage Sources Modal -->
    <div id="manageModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Manage Sources</div>
                <button class="close-btn" onclick="closeManageModal()">&times;</button>
            </div>
            <div id="sourcesList" class="sources-list"></div>
            <button class="add-btn" onclick="openAddSource()">+ ADD NEW SOURCE</button>
        </div>
    </div>

    <!-- Add/Edit Source Modal -->
    <div id="sourceModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="sourceModalTitle">Add Source</div>
                <button class="close-btn" onclick="closeSourceModal()">&times;</button>
            </div>
            <form id="sourceForm">
                <div class="form-group">
                    <label class="form-label">Name *</label>
                    <input type="text" id="sourceName" class="form-input" placeholder="e.g., BBC News" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Region *</label>
                    <select id="sourceRegion" class="form-input" required>
                        <option value="us">United States</option>
                        <option value="europe">Europe</option>
                        <option value="latam">Latin America</option>
                        <option value="mena">MENA</option>
                        <option value="asia">Asia-Pacific</option>
                        <option value="africa">Africa</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">YouTube Video URL *</label>
                    <input type="text" id="sourceUrl" class="form-input" placeholder="https://www.youtube.com/watch?v=..." required>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" onclick="closeSourceModal()">Cancel</button>
                    <button type="submit" class="btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Hidden file input for import -->
    <input type="file" id="importInput" accept=".json" style="display: none;" onchange="handleImport(event)">

    <script>
        // Load sources from localStorage
        let sources = JSON.parse(localStorage.getItem('newsWallSources')) || [];
        let gridSize = localStorage.getItem('newsWallGridSize') || 'medium';
        let currentRegionFilter = 'all';
        let activePanel = null;
        let editingIndex = null;
        let draggedIndex = null;

        function saveSources() {
            localStorage.setItem('newsWallSources', JSON.stringify(sources));
        }

        function saveGridSize() {
            localStorage.setItem('newsWallGridSize', gridSize);
        }

        function renderGrid() {
            const container = document.getElementById('gridContainer');
            const emptyState = document.getElementById('emptyState');
            
            // Filter sources by region
            let displaySources = sources;
            if (currentRegionFilter !== 'all') {
                displaySources = sources.filter(s => s.region === currentRegionFilter);
            }
            
            if (displaySources.length === 0) {
                container.innerHTML = '';
                container.style.display = 'none';
                if (sources.length === 0) {
                    emptyState.style.display = 'flex';
                } else {
                    emptyState.style.display = 'none';
                    container.innerHTML = '<div style="text-align: center; padding: 4rem; opacity: 0.6;">No sources in this region</div>';
                    container.style.display = 'block';
                }
                return;
            }

            emptyState.style.display = 'none';
            container.style.display = 'grid';
            container.className = `grid ${gridSize}`;
            
            // Only clear and rebuild if major change (otherwise just update classes)
            const existingPanels = container.querySelectorAll('.panel');
            const needsRebuild = existingPanels.length !== displaySources.length;
            
            if (needsRebuild) {
                container.innerHTML = '';
            }

            // Sort: favorites first, then by region grouping, then regular
            const sortedSources = [...displaySources].sort((a, b) => {
                if (a.favorite && !b.favorite) return -1;
                if (!a.favorite && b.favorite) return 1;
                if (a.region !== b.region) return (a.region || '').localeCompare(b.region || '');
                return 0;
            });

            sortedSources.forEach((source, displayIndex) => {
                // Find original index
                const originalIndex = sources.indexOf(source);
                
                let panel;
                if (needsRebuild) {
                    panel = document.createElement('div');
                    panel.className = 'panel';
                    panel.dataset.index = originalIndex;
                    panel.draggable = true;

                    const embedUrl = source.url.replace('watch?v=', 'embed/');
                    panel.innerHTML = `
                        <iframe 
                            id="player-${originalIndex}"
                            src="${embedUrl}?autoplay=1&mute=1&enablejsapi=1&controls=1&modestbranding=1"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                            allowfullscreen>
                        </iframe>
                        <div class="favorite-star">${source.favorite ? '★' : '☆'}</div>
                        <div class="panel-actions">
                            <button class="panel-action-btn" title="Pop Out">⛶</button>
                            <button class="panel-action-btn" title="Edit">✎</button>
                        </div>
                        <div class="panel-overlay"></div>
                    `;

                    // Drag and drop handlers
                    panel.addEventListener('dragstart', handleDragStart);
                    panel.addEventListener('dragend', handleDragEnd);
                    panel.addEventListener('dragover', handleDragOver);
                    panel.addEventListener('drop', handleDrop);
                    panel.addEventListener('dragleave', handleDragLeave);

                    // Click handler on the overlay
                    const overlay = panel.querySelector('.panel-overlay');
                    overlay.addEventListener('click', (e) => {
                        e.stopPropagation();
                        toggleAudio(originalIndex);
                    });

                    // Favorite star click handler
                    const star = panel.querySelector('.favorite-star');
                    star.addEventListener('click', (e) => {
                        e.stopPropagation();
                        toggleFavorite(originalIndex);
                    });
                    star.style.pointerEvents = 'auto';
                    star.style.cursor = 'pointer';

                    // Panel action buttons
                    const actionBtns = panel.querySelectorAll('.panel-action-btn');
                    actionBtns[0].addEventListener('click', (e) => {
                        e.stopPropagation();
                        popOutPanel(originalIndex);
                    });
                    actionBtns[0].style.pointerEvents = 'auto';
                    
                    actionBtns[1].addEventListener('click', (e) => {
                        e.stopPropagation();
                        editSource(originalIndex);
                    });
                    actionBtns[1].style.pointerEvents = 'auto';

                    container.appendChild(panel);
                } else {
                    panel = existingPanels[displayIndex];
                }

                // Update classes without rebuild
                if (source.favorite) {
                    panel.classList.add('favorite');
                } else {
                    panel.classList.remove('favorite');
                }
            });

            // Restore active state
            if (activePanel !== null && sources[activePanel]) {
                const activeElement = container.querySelector(`[data-index="${activePanel}"]`);
                if (activeElement) {
                    activeElement.classList.add('active');
                }
            }

            // Update grid size buttons
            document.querySelectorAll('.grid-size-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            const sizes = ['compact', 'medium', 'large'];
            const activeBtn = document.querySelectorAll('.grid-size-btn')[sizes.indexOf(gridSize)];
            if (activeBtn) activeBtn.classList.add('active');
        }

        // Drag and drop functions
        function handleDragStart(e) {
            draggedIndex = parseInt(this.dataset.index);
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragEnd(e) {
            this.classList.remove('dragging');
            document.querySelectorAll('.panel').forEach(panel => {
                panel.classList.remove('drag-over');
            });
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            this.classList.add('drag-over');
            return false;
        }

        function handleDragLeave(e) {
            this.classList.remove('drag-over');
        }

        function handleDrop(e) {
            e.stopPropagation();
            e.preventDefault();

            const dropIndex = parseInt(this.dataset.index);
            
            if (draggedIndex !== dropIndex) {
                // Reorder the sources array
                const draggedSource = sources[draggedIndex];
                sources.splice(draggedIndex, 1);
                const newIndex = sources.indexOf(sources.find(s => s === sources[dropIndex > draggedIndex ? dropIndex - 1 : dropIndex]));
                sources.splice(dropIndex > draggedIndex ? newIndex + 1 : newIndex, 0, draggedSource);
                
                saveSources();
                renderGrid();
            }

            this.classList.remove('drag-over');
            return false;
        }

        function toggleAudio(index) {
            const panels = document.querySelectorAll('.panel');
            
            // Mute previous
            if (activePanel !== null && activePanel !== index) {
                panels[activePanel].classList.remove('active');
                const prevIframe = document.getElementById(`player-${activePanel}`);
                if (prevIframe) {
                    prevIframe.contentWindow.postMessage('{"event":"command","func":"mute","args":""}', '*');
                }
            }

            // If clicking the same panel, just return (keep it active)
            if (activePanel === index) {
                return;
            }

            // Unmute new
            activePanel = index;
            panels[index].classList.add('active');
            const iframe = document.getElementById(`player-${index}`);
            if (iframe) {
                iframe.contentWindow.postMessage('{"event":"command","func":"unMute","args":""}', '*');
            }
        }

        function toggleFooter() {
            document.getElementById('footer').classList.toggle('visible');
        }

        function setGridSize(size) {
            gridSize = size;
            saveGridSize();
            renderGrid();
        }

        function toggleFavorite(index) {
            sources[index].favorite = !sources[index].favorite;
            saveSources();
            
            // Update UI without full refresh
            const panel = document.querySelector(`[data-index="${index}"]`);
            if (panel) {
                const star = panel.querySelector('.favorite-star');
                if (sources[index].favorite) {
                    panel.classList.add('favorite');
                    star.textContent = '★';
                } else {
                    panel.classList.remove('favorite');
                    star.textContent = '☆';
                }
            }
            
            // Re-sort without rebuild
            setTimeout(() => renderGrid(), 10);
        }

        function filterByRegion(region) {
            currentRegionFilter = region;
            renderGrid();
        }

        function muteAll() {
            if (activePanel !== null) {
                const panels = document.querySelectorAll('.panel');
                panels[activePanel].classList.remove('active');
                const iframe = document.getElementById(`player-${activePanel}`);
                if (iframe) {
                    iframe.contentWindow.postMessage('{"event":"command","func":"mute","args":""}', '*');
                }
                activePanel = null;
            }
        }

        function popOutPanel(index) {
            const source = sources[index];
            const embedUrl = source.url.replace('watch?v=', 'embed/');
            const width = 1280;
            const height = 720;
            const left = (screen.width - width) / 2;
            const top = (screen.height - height) / 2;
            
            window.open(
                embedUrl + '?autoplay=1&controls=1',
                source.name,
                `width=${width},height=${height},left=${left},top=${top},resizable=yes,scrollbars=no,toolbar=no,menubar=no,location=no,status=no`
            );
        }

        function openManageSources() {
            const list = document.getElementById('sourcesList');
            list.innerHTML = '';

            if (sources.length === 0) {
                list.innerHTML = '<div style="text-align: center; opacity: 0.6; padding: 2rem;">No sources yet</div>';
            } else {
                sources.forEach((source, index) => {
                    const item = document.createElement('div');
                    item.className = 'source-item';
                    item.innerHTML = `
                        <div class="source-info">
                            <div class="source-name">${source.favorite ? '★ ' : ''}${source.name}</div>
                            <div class="source-meta">${source.region ? source.region.toUpperCase() : 'OTHER'} • ${source.url}</div>
                        </div>
                        <div class="source-actions">
                            <button class="fav-btn ${source.favorite ? 'active' : ''}" onclick="toggleFavoriteFromModal(${index})">${source.favorite ? '★' : '☆'}</button>
                            <button class="edit-btn" onclick="editSource(${index})">Edit</button>
                            <button class="delete-btn" onclick="deleteSource(${index})">Delete</button>
                        </div>
                    `;
                    list.appendChild(item);
                });
            }

            document.getElementById('manageModal').classList.add('active');
        }

        function toggleFavoriteFromModal(index) {
            toggleFavorite(index);
            openManageSources(); // Refresh the modal
        }

        function closeManageModal() {
            document.getElementById('manageModal').classList.remove('active');
        }

        function openAddSource() {
            editingIndex = null;
            document.getElementById('sourceModalTitle').textContent = 'Add Source';
            document.getElementById('sourceName').value = '';
            document.getElementById('sourceRegion').value = 'us';
            document.getElementById('sourceUrl').value = '';
            closeManageModal();
            document.getElementById('sourceModal').classList.add('active');
        }

        function editSource(index) {
            editingIndex = index;
            const source = sources[index];
            document.getElementById('sourceModalTitle').textContent = 'Edit Source';
            document.getElementById('sourceName').value = source.name;
            document.getElementById('sourceRegion').value = source.region || 'other';
            document.getElementById('sourceUrl').value = source.url;
            closeManageModal();
            document.getElementById('sourceModal').classList.add('active');
        }

        function deleteSource(index) {
            if (confirm(`Delete ${sources[index].name}?`)) {
                sources.splice(index, 1);
                saveSources();
                renderGrid();
                openManageSources();
            }
        }

        function closeSourceModal() {
            document.getElementById('sourceModal').classList.remove('active');
        }

        document.getElementById('sourceForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const name = document.getElementById('sourceName').value.trim();
            const region = document.getElementById('sourceRegion').value;
            const url = document.getElementById('sourceUrl').value.trim();

            if (!name || !url || !region) {
                alert('Please fill in all required fields');
                return;
            }

            if (editingIndex !== null) {
                sources[editingIndex].name = name;
                sources[editingIndex].region = region;
                sources[editingIndex].url = url;
            } else {
                sources.push({ name, region, url, favorite: false });
            }

            saveSources();
            closeSourceModal();
            renderGrid();
        });

        function exportSources() {
            const dataStr = JSON.stringify(sources, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'news-wall-sources.json';
            link.click();
            URL.revokeObjectURL(url);
        }

        function importSources() {
            document.getElementById('importInput').click();
        }

        function handleImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        sources = imported;
                        saveSources();
                        renderGrid();
                        alert('Sources imported successfully!');
                    } else {
                        alert('Invalid file format');
                    }
                } catch (err) {
                    alert('Error reading file');
                }
            };
            reader.readAsText(file);
            
            // Reset input
            event.target.value = '';
        }

        // Initialize
        renderGrid();

        // Auto-activate first panel after initial render
        if (sources.length > 0 && activePanel === null) {
            setTimeout(() => toggleAudio(0), 1000);
        }

        // Keyboard shortcut for settings
        document.addEventListener('keydown', (e) => {
            if (e.key === 's' && (e.metaKey || e.ctrlKey)) {
                e.preventDefault();
                toggleFooter();
            }
        });
    </script>
</body>
</html>
