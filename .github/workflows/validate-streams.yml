name: Validate Live Streams

on:
  # ── Scheduled runs ──────────────────────────────────────────────────────────
  # Runs every 6 hours. Adjust to taste.
  # Cron syntax: minute hour day month weekday (UTC)
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours

  # ── Manual trigger ──────────────────────────────────────────────────────────
  # Run anytime from the Actions tab in GitHub
  workflow_dispatch:

  # ── On push to main ─────────────────────────────────────────────────────────
  # Useful when you add new sources to news_sources.json manually
  push:
    branches: [main]
    paths:
      - "news_sources.json"   # only re-validate if the sources file changed

permissions:
  contents: write   # needed to commit the updated JSON back to the repo

jobs:
  validate:
    name: Check stream status
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install dependencies
      - name: Install dependencies
        run: pip install requests

      # 4. Run the validator
      #    YOUTUBE_API_KEY is stored in repo Settings → Secrets → Actions
      #    Never put the actual key in this file.
      - name: Run stream validator
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/validate_streams.py
        # exit 0 = all good
        # exit 2 = dead links with no auto-replacement found (needs human review)
        # exit 1 = hard failure (missing API key, file not found, etc.)
        continue-on-error: true   # don't block the commit step on exit 2

      # 5. Commit and push the updated JSON if anything changed
      - name: Commit updated sources
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet news_sources.json || (
            git add news_sources.json &&
            git commit -m "chore: auto-update stream statuses [$(date -u +'%Y-%m-%dT%H:%MZ')]" &&
            git push
          )

      # 6. Create a GitHub Issue if there are dead links needing manual attention
      #    This requires the GITHUB_TOKEN (automatic, no setup needed)
      - name: Flag dead links as issue
        if: failure() || steps.validate.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let sources = [];
            try {
              sources = JSON.parse(fs.readFileSync('news_sources.json', 'utf8'));
            } catch (e) {
              console.log('Could not read sources file');
              return;
            }

            const dead = sources.filter(s => s.status === 'dead' && !s.replacement_found);
            if (dead.length === 0) return;

            const body = [
              '## ⚠️ Dead stream links need manual replacement',
              '',
              'The automated validator found the following streams are no longer working and could not auto-replace them:',
              '',
              ...dead.map(s => `- **${s.name}** (\`${s.region}\`) — last known URL: ${s.dead_url || s.url}`),
              '',
              'To fix: find the new live stream URL for each channel and update `news_sources.json`.',
              '',
              `*Auto-generated by validate-streams workflow on ${new Date().toISOString()}*`,
            ].join('\n');

            // Check if an issue already exists for this
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dead-stream',
            });

            if (issues.data.length > 0) {
              // Update existing issue instead of creating a duplicate
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Dead stream links — ${new Date().toISOString().slice(0,10)}`,
                body,
                labels: ['dead-stream'],
              });
            }
