name: Validate Live Streams

on:
  schedule:
    - cron: "41 9 * * *"   # daily, 09:41 UTC = 05:41 New York (04:41 in winter)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "news_sources.json"   # re-validate straight away after a manual edit

permissions:
  contents: write   # commit news_sources.json
  issues: write     # open/update/close the dead-stream issue

# Never let two repo-writing runs overlap (shared with famelack-discovery.yml)
concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  validate:
    name: Check stream status
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      # YOUTUBE_API_KEY lives in Settings → Secrets and variables → Actions.
      # Exit 1 = hard failure (bad key, missing file): the run goes red and
      # GitHub emails you. Dead streams are NOT a failure; they go to the issue.
      - name: Run stream validator
        id: validate
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/validate_streams.py

      # Commits only when the file actually changed. The validator no longer
      # writes timestamps, so a quiet day produces no commit and no Pages deploy.
      - name: Commit updated sources
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet news_sources.json; then
            git add news_sources.json
            git commit -m "chore: stream status changed [$(date -u +'%Y-%m-%dT%H:%MZ')]"
            git pull --rebase origin main
            git push
          fi

      # One issue, labelled dead-stream, kept up to date. Closes itself when
      # everything is playable again, so an open issue always means "act".
      - name: Open, update or close the dead-stream issue
        uses: actions/github-script@v8
        env:
          UNRESOLVED: ${{ steps.validate.outputs.unresolved }}
        with:
          script: |
            const fs = require('fs');
            const unresolved = parseInt(process.env.UNRESOLVED || '0', 10);
            const body = fs.existsSync('alert.md') ? fs.readFileSync('alert.md', 'utf8') : '';
            const { owner, repo } = context.repo;
            const label = 'dead-stream';

            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (e) {
              await github.rest.issues.createLabel({ owner, repo, name: label, color: 'b60205',
                description: 'Streams the validator could not fix on its own' });
            }

            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: label });
            const existing = open.data[0];
            const title = `${unresolved} stream${unresolved === 1 ? '' : 's'} need a new link`;

            if (unresolved > 0) {
              if (existing) {
                if (existing.body !== body || existing.title !== title) {
                  await github.rest.issues.update({ owner, repo, issue_number: existing.number, title, body });
                }
              } else {
                await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
              }
            } else if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number,
                body: 'All streams are playable again. Closing automatically.' });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
            }
